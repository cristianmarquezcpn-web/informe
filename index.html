<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Informes - Esencial Pro</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; padding: 30px; max-width: 1000px; margin: 0 auto; }
        h2 { color: #1a2a6c; margin-bottom: 20px; border-bottom: 3px solid #3b82f6; padding-bottom: 10px; }
        select, textarea, input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #d1d5db; font-size: 14px; }
        select { background: white; cursor: pointer; }
        textarea { min-height: 100px; font-family: inherit; resize: vertical; }
        button { background: #1a2a6c; color: white; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
        button:hover { background: #3b82f6; transform: scale(1.01); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .stats { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
        .stat-item { background: #e2e8f0; padding: 8px 15px; border-radius: 8px; font-size: 12px; }
        
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(26, 42, 108, 0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .login-box { background: white; padding: 40px; border-radius: 12px; width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        
        #editor-container { height: 400px; background: white; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }
        .ql-toolbar { border-top-left-radius: 8px; border-top-right-radius: 8px; background: #f8fafc; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 15px; }
        table.rubrica { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 15px; }
        table.rubrica th, table.rubrica td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; font-size: 13px; }
        table.rubrica th { background: #f1f5f9; }
    </style>
</head>
<body>
<div id="login-overlay">
    <div class="login-box">
        <h2 style="border:none; color:#1a2a6c;">ESENCIAL</h2>
        <p style="margin-bottom: 20px; color: #64748b;">Acceso seguro con cuenta de Google</p>
        <button onclick="iniciarSesionGoogle()" style="background: #ffffff; color: #555; border: 1px solid #ccc; font-weight: bold;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" style="width:20px; margin-right:10px;">
            INGRESAR CON GOOGLE
        </button>
    </div>
</div>

    <div id="app-content" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>📋 Generador de Informes Profesionales</h2>
            <button onclick="cerrarSesion()" style="width: auto; background: #ef4444; padding: 8px 15px;">Salir</button>
        </div>
        
        <div class="card">
            <div class="grid">
                <div>
                    <label><b>Módulo:</b></label>
                    <select id="mod" onchange="listarPacientes()">
                        <option value="cd">Centro de Día (CD)</option>
                        <option value="cet">CET</option>
                        <option value="rehab">Rehabilitación (REHAB)</option>
                    </select>
                </div>
                <div>
                    <label><b>Paciente:</b></label>
                    <select id="paciente-select" onchange="cargarDatosPaciente()">
                        <option value="">Seleccionar paciente...</option>
                    </select>
                </div>
            </div>
            
            <div class="stats">
                <span class="stat-item" id="stats-pacientes">👥 0 pacientes</span>
            </div>
        </div>
        
        <div class="card" id="datos-paciente" style="display:none;">
            <h3 style="margin-bottom:10px;">📄 Paciente: <span id="nombre-paciente-title"></span></h3>
            
            <div class="info-grid">
                <div><strong>Beneficiario:</strong> <span id="lbl-nombre"></span></div>
                <div><strong>Fecha de Nacimiento:</strong> <input type="text" id="val-nac" style="padding:4px; margin:0; width:auto; display:inline-block;" placeholder="Ej: 13/10/2021"></div>
                <div><strong>Edad:</strong> <input type="text" id="val-edad" style="padding:4px; margin:0; width:auto; display:inline-block;" placeholder="Ej: 4 años"></div>
                <div><strong>Diagnóstico (CUD):</strong> <input type="text" id="val-diag" style="padding:4px; margin:0; width:70%; display:inline-block;" placeholder="Diagnóstico..."></div>
                <div><strong>Fecha de Informe:</strong> <input type="text" id="val-fechainf" style="padding:4px; margin:0; width:auto; display:inline-block;"></div>
            </div>
            
            <div class="grid">
                <div>
                    <label><b>TIPO DE INFORME:</b></label>
                    <select id="tipo-informe" onchange="cambiarEstructuraFormulario(); cargarInformeArea();">
                        <option value="inicial">Informe Inicial</option>
                        <option value="trimestral1">Informe Primer Trimestre / Proceso</option>
                        <option value="trimestral2">Informe Segundo Trimestre / Avances (Con Rúbrica)</option>
                        <option value="trimestral3">Informe Tercer Trimestre / Cierre</option>
                        <option value="plan">Plan Terapéutico</option>
                    </select>
                </div>
                <div>
                    <label><b>● ÁREA:</b></label>
                    <select id="area-rep" onchange="cargarInformeArea()">
                        <option value="Psicología">Psicología</option>
                        <option value="Psicopedagogía">Psicopedagogía</option>
                        <option value="Kinesiología">Kinesiología</option>
                        <option value="Terapia Ocupacional">Terapia Ocupacional</option>
                        <option value="Fonoaudiología">Fonoaudiología</option>
                        <option value="Trabajo Social">Trabajo Social</option>
                    </select>
                </div>
            </div>

            <div style="margin-top:15px; background: #e0f2fe; padding: 12px; border-radius: 8px; border: 1px solid #bae6fd;">
                <label style="color: #0369a1;"><b>🔄 COPIAR DATOS DE UN INFORME ANTERIOR:</b></label>
                <select id="select-copiar-previo" onchange="copiarDatosInformePrevio()" style="margin-top:5px; background: white;">
                    <option value="">Selecciona un informe previo para autocompletar...</option>
                </select>
            </div>

            <div style="margin-top:15px;">
                <label><b>● PROFESIONAL / RESPONSABLE:</b></label>
                <input type="text" id="profesional-rep" placeholder="Nombre completo del profesional">
            </div>
            
            <!-- CONTENEDOR DINÁMICO SEGÚN EL MODELO SELECCIONADO -->
            <div id="campos-dinamicos-modelo"></div>

            <div style="display:flex; gap:10px; margin-top:20px; margin-bottom: 25px;">
                <button id="btn-ia" onclick="generarBorradorIA()" style="flex:1; background:#10b981;">🤖 CORREGIR Y PASAR AL EDITOR</button>
                <button onclick="guardarBorrador()" style="flex:1; background:#8b5cf6;">💾 GUARDAR BORRADOR</button>
            </div>

            <hr style="border: 1px solid #e2e8f0; margin-bottom: 20px;">

            <label><b>📝 Editor de Informe Final (Vista Previa Real):</b></label>
            <p style="font-size: 12px; color: #64748b; margin-bottom: 10px;">
                Aquí puedes ajustar fuentes, insertar firmas y sellos mediante el icono de imagen 🏞️.
            </p>
            
            <div id="editor-container"></div>
            
            <button onclick="exportarPDF()" style="margin-top: 20px; font-size: 16px; padding: 15px; background: #2563eb;">
                📄 DESCARGAR PDF FINAL Y GUARDAR REGISTRO
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAugXXx_b_wKFByhDbLZslk2HA_UTzrzd8",
            authDomain: "clinicaintegral-5c488.firebaseapp.com",
            databaseURL: "https://clinicaintegral-5c488-default-rtdb.firebaseio.com",
            projectId: "clinicaintegral-5c488",
            storageBucket: "clinicaintegral-5c488.appspot.com",
            appId: "1:184090967634:web:09715937b33ea48288698b"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let datosPacienteCompleto = {};
        let quillEditor;
        let historialesPacienteCache = {};

        window.onload = function() {
            quillEditor = new Quill('#editor-container', {
                theme: 'snow',
                modules: {
                    toolbar: [
                        [{ 'font': [] }, { 'size': ['small', false, 'large', 'huge'] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ 'color': [] }, { 'background': [] }],
                        [{ 'align': [] }, { 'list': 'ordered'}, { 'list': 'bullet' }],
                        ['image'],
                        ['clean']
                    ]
                },
                placeholder: 'El informe formateado y corregido aparecerá aquí...'
            });
            document.getElementById('val-fechainf').value = new Date().toLocaleDateString('es-AR');
            cambiarEstructuraFormulario();
        };

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                listarPacientes();
            } else {
                document.getElementById('login-overlay').style.display = 'flex';
                document.getElementById('app-content').style.display = 'none';
            }
        });

        const provider = new firebase.auth.GoogleAuthProvider();
        function iniciarSesionGoogle() { auth.signInWithPopup(provider).catch(e => alert(e.message)); }
        function cerrarSesion() { auth.signOut(); }

        function listarPacientes() {
            const mod = document.getElementById('mod').value;
            const select = document.getElementById('paciente-select');
            select.innerHTML = '<option value="">⏳ Cargando...</option>';
            
            db.ref(mod + '/pacientes').once('value', snap => {
                select.innerHTML = '<option value="">Seleccionar paciente...</option>';
                let count = 0;
                snap.forEach(child => {
                    const pac = child.val();
                    const nombre = child.key;
                    if (pac && nombre) {
                        const opt = document.createElement('option');
                        opt.value = nombre;
                        opt.textContent = nombre;
                        select.appendChild(opt);
                        count++;
                    }
                });
                document.getElementById('stats-pacientes').textContent = `👥 ${count} pacientes`;
            });
        }

        function cargarDatosPaciente() {
            const select = document.getElementById('paciente-select');
            const nombre = select.value;
            const mod = document.getElementById('mod').value;
            const container = document.getElementById('datos-paciente');
            
            if (!nombre) { container.style.display = 'none'; return; }
            
            document.getElementById('nombre-paciente-title').textContent = nombre;
            document.getElementById('lbl-nombre').textContent = nombre;
            container.style.display = 'block';
            
            db.ref(mod + '/paciente/' + nombre).once('value', snap => {
                datosPacienteCompleto = snap.val() || {};
                document.getElementById('val-nac').value = datosPacienteCompleto.nacimiento || datosPacienteCompleto.nac || datosPacienteCompleto.fechaNacimiento || '';
                document.getElementById('val-edad').value = datosPacienteCompleto.edad || '';
                document.getElementById('val-diag').value = datosPacienteCompleto.diagnostico || datosPacienteCompleto.diag || '';
            });

            db.ref('historial_informes/' + nombre).once('value', snap => {
                historialesPacienteCache = {};
                const selectCopiar = document.getElementById('select-copiar-previo');
                selectCopiar.innerHTML = '<option value="">Selecciona un informe previo para autocompletar...</option>';
                snap.forEach(child => {
                    const inf = child.val();
                    const key = child.key;
                    historialesPacienteCache[key] = inf;
                    const opt = document.createElement('option');
                    opt.value = key;
                    opt.textContent = `[${inf.area}] - ${inf.tipo} (${new Date(inf.fecha).toLocaleDateString()})`;
                    selectCopiar.appendChild(opt);
                });
            });

            cargarInformeArea();
        }

        function cambiarEstructuraFormulario() {
            const tipo = document.getElementById('tipo-informe').value;
            const contenedor = document.getElementById('campos-dinamicos-modelo');
            
            if (tipo === 'inicial') {
                contenedor.innerHTML = `
                    <div style="margin-top:15px;"><label><b>MOTIVO DE CONSULTA:</b></label><textarea id="f-motivo" placeholder="Motivo de consulta..."></textarea></div>
                    <div style="margin-top:15px;"><label><b>ANTECEDENTES RELEVANTES AL ÁREA:</b></label><textarea id="f-antecedentes" placeholder="Antecedentes..."></textarea></div>
                    <div style="margin-top:15px;"><label><b>ACTITUD OBSERVABLE DURANTE LOS ENCUENTROS:</b></label><textarea id="f-actitud" placeholder="Actitud observable..."></textarea></div>
                    <div style="margin-top:15px;"><label><b>ASPECTO DEL LENGUAJE Y LA COMUNICACIÓN - COMPRENSIVO:</b></label><textarea id="f-comprensivo" placeholder="Aspecto comprensivo..."></textarea></div>
                    <div style="margin-top:15px;"><label><b>ASPECTO DEL LENGUAJE Y LA COMUNICACIÓN - EXPRESIVO:</b></label><textarea id="f-expresivo" placeholder="Aspecto expresivo..."></textarea></div>
                `;
            } else if (tipo === 'trimestral1') {
                contenedor.innerHTML = `
                    <div style="margin-top:15px;"><label><b>TEST ADMINISTRADOS:</b></label><textarea id="f-test" placeholder="Test administrados..."></textarea></div>
                    <div style="margin-top:15px;"><label><b>RESULTADOS OBTENIDOS E INTERPRETACIÓN DE TEST:</b></label><textarea id="f-resultados" placeholder="Resultados..."></textarea></div>
                    <div style="margin-top:15px;"><label><b>SÍNTESIS Y CONCLUSIONES:</b></label><textarea id="f-sintesis" placeholder="Conclusiones..."></textarea></div>
                    <div style="margin-top:15px;"><label><b>SUGERENCIAS ESCUELA REGULAR:</b></label><textarea id="f-sugerencias" placeholder="Sugerencias..."></textarea></div>
                `;
            } else if (tipo === 'trimestral2') {
                contenedor.innerHTML = `
                    <div style="margin-top:15px;"><label><b>INTRODUCCIÓN / DESCRIPCIÓN DEL TRIMESTRE:</b></label><textarea id="f-intro" placeholder="Durante este segundo trimestre..."></textarea></div>
                    <div style="margin-top:15px;">
                        <label><b>ESTADO DE LA RÚBRICA (Selecciona valores rápidos o personaliza):</b></label>
                        <table class="rubrica" id="tabla-rubrica-inputs">
                            <tr><th>Ítem de Evaluación</th><th>Estado (L / LCA / EVL)</th></tr>
                            <tr><td>Control postural (Musculatura extensora/abdominal/sedestación)</td><td><input type="text" id="r1" value="LCA" style="padding:4px;"></td></tr>
                            <tr><td>Habilidades motoras gruesas (Equilibrio, subir/bajar escaleras, correr)</td><td><input type="text" id="r2" value="L" style="padding:4px;"></td></tr>
                            <tr><td>Motricidad fina (Agarre, alcance, transporte, pinza)</td><td><input type="text" id="r3" value="LCA" style="padding:4px;"></td></tr>
                            <tr><td>Tono muscular (Disminución de tono / mejoría)</td><td><input type="text" id="r4" value="EVL" style="padding:4px;"></td></tr>
                            <tr><td>Comunicación e interés (Expresiones, consignas, interés)</td><td><input type="text" id="r5" value="L" style="padding:4px;"></td></tr>
                        </table>
                    </div>
                    <div style="margin-top:15px;"><label><b>OBSERVACIONES ADICIONALES DE RÚBRICA:</b></label><textarea id="f-obs" placeholder="Observaciones adicionales..."></textarea></div>
                `;
            } else if (tipo === 'trimestral3') {
                contenedor.innerHTML = `
                    <div style="margin-top:15px;"><label><b>RESUMEN GENERAL Y TRABAJO DEL ÚLTIMO TRIMESTRE:</b></label><textarea id="f-resumen" placeholder="Realizar un resumen de todos los informes y lo trabajado este último trimestre..."></textarea></div>
                    <div style="margin-top:15px;"><label><b>SUGERENCIAS FINALES:</b></label><textarea id="f-sugfinal" placeholder="Sugerencias..."></textarea></div>
                `;
            } else if (tipo === 'plan') {
                contenedor.innerHTML = `
                    <div style="margin-top:15px;"><label><b>MODALIDAD DE TRATAMIENTO:</b></label><input type="text" id="f-modtrat" value="Tratamiento Integral bajo modalidad interdisciplinaria"></div>
                    <div style="margin-top:15px;"><label><b>OBJETIVOS GENERALES (Uno por línea):</b></label><textarea id="f-objgen" placeholder="Promover la autonomía...\nPromover el registro social..."></textarea></div>
                    <div style="margin-top:15px;"><label><b>OBJETIVOS ESPECÍFICOS (Uno por línea):</b></label><textarea id="f-objesp" placeholder="Estimular modulación sensorial...\nFavorecer regulación..."></textarea></div>
                    <div style="margin-top:15px;"><label><b>ESTRATEGIAS GENERALES DESDE EL ÁREA:</b></label><textarea id="f-estrategias" placeholder="Estrategias generales..."></textarea></div>
                `;
            }
        }

        function cargarInformeArea() {
            const nombre = document.getElementById('paciente-select').value;
            const tipo = document.getElementById('tipo-informe').value;
            const area = document.getElementById('area-rep').value;
            if (!nombre) return;

            db.ref('borradores_informes/' + nombre + '/' + area + '/' + tipo).once('value', snap => {
                const b = snap.val();
                if (b) {
                    if(b.profesional) document.getElementById('profesional-rep').value = b.profesional;
                    if(b.datos && typeof b.datos === 'object') {
                        for(let k in b.datos) {
                            const el = document.getElementById(k);
                            if(el) el.value = b.datos[k];
                        }
                    }
                }
            });
        }

        function copiarDatosInformePrevio() {
            const key = document.getElementById('select-copiar-previo').value;
            if (!key || !historialesPacienteCache[key]) return;
            const inf = historialesPacienteCache[key];
            if(inf.profesional) document.getElementById('profesional-rep').value = inf.profesional;
            if(inf.contenidoHTML) quillEditor.clipboard.dangerouslyPasteHTML(inf.contenidoHTML);
            alert("¡Datos previos cargados en el editor!");
        }

        async function generarBorradorIA() {
            const nombre = document.getElementById('paciente-select').value;
            if (!nombre) return alert("Seleccioná un paciente primero.");
            
            const btn = document.getElementById('btn-ia');
            btn.disabled = true;
            btn.textContent = '⏳ Mejorando redacción con IA...';
            
            try {
                const tipo = document.getElementById('tipo-informe').value;
                let inputsRecopilados = {};
                let camposHtml = "";

                if (tipo === 'inicial') {
                    inputsRecopilados.f_motivo = document.getElementById('f-motivo').value;
                    inputsRecopilados.f_antecedentes = document.getElementById('f-antecedentes').value;
                    inputsRecopilados.f_actitud = document.getElementById('f-actitud').value;
                    inputsRecopilados.f_comprensivo = document.getElementById('f-comprensivo').value;
                    inputsRecopilados.f_expresivo = document.getElementById('f-expresivo').value;
                    
                    camposHtml = `<p><strong>MOTIVO DE CONSULTA:</strong><br>${inputsRecopilados.f_motivo}</p><br>
                                  <p><strong>ANTECEDENTES RELEVANTES AL ÁREA:</strong><br>${inputsRecopilados.f_antecedentes}</p><br>
                                  <p><strong>ACTITUD OBSERVABLE DURANTE LOS ENCUENTROS:</strong><br>${inputsRecopilados.f_actitud}</p><br>
                                  <p><strong>ASPECTO DEL LENGUAJE Y LA COMUNICACIÓN</strong></p>
                                  <p><strong>COMPRENSIVO:</strong><br>${inputsRecopilados.f_comprensivo}</p><br>
                                  <p><strong>EXPRESIVO:</strong><br>${inputsRecopilados.f_expresivo}</p>`;
                } else if (tipo === 'trimestral1') {
                    inputsRecopilados.f_test = document.getElementById('f-test').value;
                    inputsRecopilados.f_resultados = document.getElementById('f-resultados').value;
                    inputsRecopilados.f_sintesis = document.getElementById('f-sintesis').value;
                    inputsRecopilados.f_sugerencias = document.getElementById('f-sugerencias').value;

                    camposHtml = `<p><strong>TEST ADMINISTRADOS:</strong><br>${inputsRecopilados.f_test}</p><br>
                                  <p><strong>RESULTADOS OBTENIDOS E INTERPRETACIÓN DE TEST:</strong><br>${inputsRecopilados.f_resultados}</p><br>
                                  <p><strong>SÍNTESIS Y CONCLUSIONES:</strong><br>${inputsRecopilados.f_sintesis}</p><br>
                                  <p><strong>SUGERENCIAS ESCUELA REGULAR:</strong><br>${inputsRecopilados.f_sugerencias}</p>`;
                } else if (tipo === 'trimestral2') {
                    inputsRecopilados.f_intro = document.getElementById('f-intro').value;
                    inputsRecopilados.f_obs = document.getElementById('f-obs').value;
                    inputsRecopilados.r1 = document.getElementById('r1').value;
                    inputsRecopilados.r2 = document.getElementById('r2').value;
                    inputsRecopilados.r3 = document.getElementById('r3').value;
                    inputsRecopilados.r4 = document.getElementById('r4').value;
                    inputsRecopilados.r5 = document.getElementById('r5').value;

                    camposHtml = `<p>${inputsRecopilados.f_intro}</p><br>
                                  <p><strong>RÚBRICA DE OBJETIVOS TERAPÉUTICOS:</strong> (L: Logrado | LCA: Logrado con Autonomía | EVL: En Vías de Logro)</p>
                                  <ul>
                                      <li>Control postural: <b>[${inputsRecopilados.r1}]</b></li>
                                      <li>Habilidades motoras gruesas: <b>[${inputsRecopilados.r2}]</b></li>
                                      <li>Motricidad fina: <b>[${inputsRecopilados.r3}]</b></li>
                                      <li>Tono muscular: <b>[${inputsRecopilados.r4}]</b></li>
                                      <li>Comunicación e interés: <b>[${inputsRecopilados.r5}]</b></li>
                                  </ul><br>
                                  <p><strong>OBSERVACIÓN:</strong><br>${inputsRecopilados.f_obs}</p>`;
                } else if (tipo === 'trimestral3') {
                    inputsRecopilados.f_resumen = document.getElementById('f-resumen').value;
                    inputsRecopilados.f_sugfinal = document.getElementById('f-sugfinal').value;
                    camposHtml = `<p><strong>RESUMEN Y TRABAJO DEL ÚLTIMO TRIMESTRE:</strong><br>${inputsRecopilados.f_resumen}</p><br>
                                  <p><strong>SUGERENCIAS:</strong><br>${inputsRecopilados.f_sugfinal}</p>`;
                } else if (tipo === 'plan') {
                    inputsRecopilados.f_modtrat = document.getElementById('f-modtrat').value;
                    inputsRecopilados.f_objgen = document.getElementById('f-objgen').value;
                    inputsRecopilados.f_objesp = document.getElementById('f-objesp').value;
                    inputsRecopilados.f_estrategias = document.getElementById('f-estrategias').value;

                    camposHtml = `<p><strong>MODALIDAD DE TRATAMIENTO:</strong> ${inputsRecopilados.f_modtrat}</p><br>
                                  <p><strong>OBJETIVOS GENERALES:</strong><br>${inputsRecopilados.f_objgen.replace(/\n/g, '<br>')}</p><br>
                                  <p><strong>OBJETIVOS ESPECÍFICOS:</strong><br>${inputsRecopilados.f_objesp.replace(/\n/g, '<br>')}</p><br>
                                  <p><strong>ESTRATEGIAS GENERALES:</strong><br>${inputsRecopilados.f_estrategias}</p>`;
                }

                const prompt = `Actúa como un corrector ortotipográfico y redactor clínico profesional. Mejora la redacción, puntuación y fluidez de los siguientes campos sin alterar datos clínicos ni inventar nada. Devuelve el resultado en formato HTML limpio estructurado:\n${camposHtml}`;
                
                const respuesta = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer sk-0466f0ae0854462cbe67f590742d83ac' },
                    body: JSON.stringify({ model: 'deepseek-v4-pro', messages: [{ role: 'user', content: prompt }], temperature: 0.3 })
                });
                
                if (!respuesta.ok) throw new Error("Error en API IA");
                const data = await respuesta.json();
                let htmlGenerado = data.choices[0].message.content.replace(/```html/g, '').replace(/```/g, '').trim();
                
                quillEditor.clipboard.dangerouslyPasteHTML(htmlGenerado);
                alert("¡Texto mejorado y cargado en el editor con éxito!");
            } catch(e) {
                console.error(e);
                alert("Error al conectar con la IA.");
            }
            btn.disabled = false;
            btn.textContent = '🤖 CORREGIR Y PASAR AL EDITOR';
        }

        async function exportarPDF() {
            const nombre = document.getElementById('paciente-select').value;
            if (!nombre) return alert("Selecciona un paciente.");
            
            const area = document.getElementById('area-rep').value || '_________________';
            const profesional = document.getElementById('profesional-rep').value || '_________________';
            const tipoInforme = document.getElementById('tipo-informe');
            const textoTypeVal = tipoInforme.options[tipoInforme.selectedIndex].text.toUpperCase();
            
            const anioActual = new Date().getFullYear();
            const fechaHoy = document.getElementById('val-fechainf').value || new Date().toLocaleDateString('es-AR');
            const fechaNac = document.getElementById('val-nac').value || 'S/D';
            const edad = document.getElementById('val-edad').value || 'S/D';
            const diagnostico = document.getElementById('val-diag').value || 'S/D';
            
            const elementoTemporal = document.createElement('div');
            elementoTemporal.style.fontFamily = "'Times New Roman', Times, serif"; 
            elementoTemporal.style.fontSize = "14px";
            elementoTemporal.style.padding = "40px";
            elementoTemporal.style.position = "absolute";
            elementoTemporal.style.left = "-9999px";
            elementoTemporal.style.top = "0";
            elementoTemporal.style.width = "210mm";
            elementoTemporal.style.backgroundColor = "#ffffff";
            elementoTemporal.style.boxSizing = "border-box";
            
            elementoTemporal.innerHTML = `
                <div style="display: flex; align-items: flex-end; margin-bottom: 30px;">
                    <h1 style="color: #1a2a6c; margin: 0; font-size: 42px; font-weight: bold; line-height: 0.8; font-family: 'Georgia', serif;">Esencial</h1>
                    <div style="flex-grow: 1; height: 3px; background-color: #1a2a6c; margin-left: 15px; margin-bottom: 6px;"></div>
                </div>

                <div style="text-align: center; font-weight: bold; margin-bottom: 25px; font-size: 15px;">
                    <div style="text-decoration: underline;">${textoTypeVal}</div>
                    <div style="margin-top: 5px;">${anioActual}</div>
                </div>

                <ul style="list-style-type: disc; margin-bottom: 35px; padding-left: 40px; line-height: 2.0;">
                    <li><strong>ÁREA:</strong> <span style="text-transform: uppercase;">${area}</span></li>
                    <li><strong>APELLIDO Y NOMBRE DEL BENEFICIARIO:</strong> <span style="text-transform: uppercase;">${nombre}</span></li>
                    <li><strong>FECHA DE NACIMIENTO:</strong> ${fechaNac}</li>
                    <li><strong>EDAD:</strong> ${edad}</li>
                    <li><strong>DIAGNÓSTICO (SEGÚN CUD):</strong> ${diagnostico}</li>
                    <li><strong>FECHA DE INFORME:</strong> ${fechaHoy}</li>
                    <li><strong>PROFESIONAL / RESPONSABLE:</strong> <span style="text-transform: uppercase;">${profesional}</span></li>
                </ul>

                <div class="contenido-quill" style="line-height: 1.6; padding-left: 10px; padding-right: 10px; margin-bottom: 60px;">
                    ${quillEditor.root.innerHTML} 
                </div>

                <div style="margin-top: 40px; font-family: Arial, sans-serif;">
                    <div style="display:flex; justify-content:center; gap: 40px; font-size: 11px; color: #1a2a6c; margin-bottom: 8px;">
                        <div>🌐 www.esencialsalud.com.ar</div>
                        <div>📞 4323086 / 4210238</div>
                    </div>
                    <div style="display:flex; justify-content:center; gap: 40px; font-size: 11px; color: #1a2a6c; margin-bottom: 15px;">
                        <div>✉️ contacto@esencialsalud.com.ar</div>
                        <div>📍 25 de mayo 30 (E) Ciudad de San Juan / Av. Córdoba 585 (O)</div>
                    </div>
                    <div style="background-color: #1a2a6c; height: 35px; border-top-left-radius: 40px; margin-left: 200px;"></div>
                </div>
            `;

            document.body.appendChild(elementoTemporal);

            const opciones = {
                margin:       [10, 10, 10, 10],
                filename:     `Informe_${area}_${textoTypeVal.replace(/\s+/g, '_')}_${nombre.replace(/\s+/g, '_')}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opciones).from(elementoTemporal).save().then(() => {
                document.body.removeChild(elementoTemporal);

                const dataRegistro = {
                    fecha: Date.now(),
                    tipo: textoTypeVal,
                    area: area,
                    profesional: profesional,
                    contenidoHTML: quillEditor.root.innerHTML,
                    modulo: document.getElementById('mod').value
                };

                db.ref('historial_informes/' + nombre).push(dataRegistro);
                db.ref('informes_por_area/' + nombre + '/' + area + '/' + document.getElementById('tipo-informe').value).set(dataRegistro);
            }).catch(err => {
                if (document.body.contains(elementoTemporal)) document.body.removeChild(elementoTemporal);
                alert("Error al exportar PDF: " + err.message);
            });
        }

        function guardarBorrador() {
            const nombre = document.getElementById('paciente-select').value;
            const area = document.getElementById('area-rep').value;
            const tipo = document.getElementById('tipo-informe').value;
            if (!nombre) return;
            
            // Recolectar dinámicamente los campos actuales
            let datosInputs = {};
            document.querySelectorAll('#campos-dinamicos-modelo input, #campos-dinamicos-modelo textarea').forEach(el => {
                if (el.id) datosInputs[el.id] = el.value;
            });

            let datosBorrador = {
                tipoInforme: tipo,
                area: area,
                profesional: document.getElementById('profesional-rep').value,
                datos: datosInputs,
                timestamp: Date.now()
            };
            
            db.ref('borradores_informes/' + nombre + '/' + area + '/' + tipo).set(datosBorrador)
              .then(() => alert("Borrador guardado correctamente."));
        }
    </script>
